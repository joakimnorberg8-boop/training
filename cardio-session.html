<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#08090e">
  <title>Cardio — GAYM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=rc40">
  <link rel="stylesheet" href="layout-rc37.css?v=2">
  <link rel="stylesheet" href="cardio-rc40.css?v=1">
</head>
<body class="detail-page active-workout-page cardio-timer-page">
  <div class="app-shell cardio-timer-shell">
    <header class="cardio-native-top" aria-label="Cardio timer navigation">
      <a id="cardio-back" class="cardio-top-icon" href="cardio.html" aria-label="Back to cardio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <strong>Cardio</strong>
      <button id="cardio-menu-button" class="cardio-top-icon" type="button" aria-label="Timer options" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <div class="cardio-overflow-menu" id="cardio-overflow-menu" hidden>
        <button type="button" id="restart-cardio">Restart timer</button>
        <a href="cardio.html">Choose another workout</a>
      </div>
    </header>

    <main class="cardio-session-main cardio-first-style">
      <section class="interval-player cardio-ring-player" aria-live="polite">
        <p class="cardio-session-label">INTERVALS</p>
        <div class="cardio-activity-title">
          <span class="cardio-activity-icon" id="activity-icon" aria-hidden="true"></span>
          <h1 id="session-fun">Running</h1>
        </div>
        <p class="real-name" id="session-name"></p>

        <div class="cardio-session-pills" aria-label="Workout plan">
          <span><b id="round-total">1</b> INTERVALS</span>
          <span>TOTAL <b id="planned-total">00:00</b></span>
        </div>

        <div class="timer-ring" id="timer-ring" aria-label="Interval countdown">
          <div class="timer-ring-track"></div>
          <div class="timer-ring-inner">
            <span class="ring-activity-icon" id="ring-activity-icon" aria-hidden="true"></span>
            <div class="mega-timer" id="mega-timer">00:00</div>
            <div class="interval-type-label" id="interval-type">WORK</div>
            <div class="round-counter"><strong id="round-current">1</strong> / <span id="round-total-mirror">1</span></div>
          </div>
        </div>

        <div class="cardio-next-block">
          <span>UP NEXT</span>
          <strong id="next-phase-name">REST</strong>
          <small id="next-phase-time">00:00</small>
        </div>

        <div class="cardio-control-row">
          <button id="timer-minus" type="button" aria-label="Subtract 15 seconds">−15s</button>
          <button id="timer-start" class="cardio-main-control" type="button">START</button>
          <button id="timer-plus" type="button" aria-label="Add 15 seconds">+15s</button>
        </div>

        <button id="log-cardio-now" class="cardio-end-button" type="button">END WORKOUT</button>
      </section>
    </main>
  </div>

  <div class="workout-complete-modal" id="workout-complete-modal" aria-hidden="true">
    <div class="workout-complete-backdrop"></div>
    <section class="workout-complete-card" role="dialog" aria-modal="true" aria-labelledby="workout-complete-title">
      <p class="eyebrow" id="workout-complete-kicker">CARDIO COMPLETE</p>
      <h2 id="workout-complete-title">You survived.</h2>
      <p class="workout-complete-copy" id="workout-complete-copy"></p>
      <div class="workout-complete-stats" id="workout-complete-stats"></div>
      <a class="workout-home-button" href="index.html">BACK TO HOME PAGE <span></span></a>
    </section>
  </div>

  <script src="cardio-session.js?v=rc41"></script>
  <script src="app-core.js?v=rc41"></script>
</body>
</html>
