<body class="workout-page cardio-menu-page">
<div class="app-shell cardio-menu-shell">
<header class="cardio-menu-top">
  <a class="cardio-top-icon" href="workout.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <strong>Cardio</strong>
  <a class="cardio-top-icon" href="daily.html" aria-label="Cardio history"><svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V5M14 20v-8M19 20V3M3 20h18"/></svg></a>
</header>

<main class="cardio-menu-main">
  <section class="cardio-menu-chooser" aria-labelledby="activity-title">
    <p id="activity-title" class="cardio-menu-kicker">CHOOSE ACTIVITY</p>
    <div class="cardio-activity-list" id="cardio-activity-list"></div>
  </section>

  <section class="cardio-programs" id="cardio-programs">
    <div class="cardio-selected-head">
      <span class="cardio-selected-icon" id="selected-activity-icon"></span>
      <div><p>WORKOUTS FOR</p><h1 id="selected-activity-name">Running</h1><span id="selected-activity-subtitle">Outdoor or treadmill</span></div>
    </div>
    <div class="cardio-program-list" id="cardio-program-list"></div>
    <a class="cardio-menu-start" id="start-cardio" href="cardio-session.html">START RUNNING</a>
  </section>

  <section class="cardio-guidance-card">
    <strong>HOW HARD?</strong>
    <p>Moderate: you can talk, but not sing. Vigorous: only a few words before you need a breath.</p>
  </section>

  <section class="simple-history-strip cardio-history-strip" id="cardio-summary"><div><span>LAST WORKOUT</span><strong>No workout logged yet</strong></div><a href="daily.html">View history</a></section>
