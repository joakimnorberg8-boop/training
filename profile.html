<body><div class="app-shell"><header class="topbar"><a class="wordmark" href="index.html">GAY<span>M</span></a><div class="page-status"><span class="pulse-dot"></span> YOUR SETTINGS</div><a class="profile-button profile-link" href="profile.html">AK</a></header>
